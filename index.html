<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Recovery Channel</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TBT8ZJFEYV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-TBT8ZJFEYV');
</script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    background: #2b3a42;
    font-family: 'Open Sans', "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #e0e6e6;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    text-align: center;
  }

  h1, h2 {
    margin: 10px 0;
  }

  .button-link {
    display: inline-block;
    background: #4db6ac;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none;
    margin-top: 10px;
    font-weight: 600;
  }

  .button-link:hover {
    background: #3a9a8a;
  }

  .section-heading {
    text-align: left;
    margin-top: 28px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    margin-bottom: 20px;
    justify-content: flex-start;
    padding-bottom: 6px;
    scroll-behavior: smooth;
  }

  .row::-webkit-scrollbar {
    height: 10px;
  }

  .row::-webkit-scrollbar-thumb {
    background: rgba(77, 182, 172, 0.45);
    border-radius: 999px;
  }

  .card {
    min-width: 190px;
    max-width: 190px;
    background: #243238;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    text-align: left;
    border: 1px solid rgba(255,255,255,0.05);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
  }

  .card img {
    width: 100%;
    height: 107px;
    object-fit: cover;
    display: block;
  }

  .card-content {
    padding: 9px 10px 12px;
  }

  .card a {
    color: #4db6ac;
    text-decoration: none;
    font-size: 0.88em;
    font-weight: 600;
    line-height: 1.35;
    display: block;
    margin-bottom: 6px;
  }

  .card a:hover {
    text-decoration: underline;
  }

  .card-meta {
    font-size: 0.72em;
    color: #b9c9c9;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .highlight {
    box-shadow: 0 0 0 2px #4db6ac, 0 0 24px rgba(77, 182, 172, 0.45);
    border-color: #4db6ac;
  }

  /* Chatbot */
  #chatbox {
    width: 300px;
    background: #1f2a30;
    border-radius: 12px;
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
  }

  #chat-header {
    background: #4db6ac;
    padding: 10px;
    text-align: center;
    color: white;
    font-weight: 700;
  }

  #chat-messages {
    height: 280px;
    overflow-y: auto;
    padding: 12px;
    font-size: 0.92em;
    text-align: left;
    line-height: 1.45;
  }

  .chat-line {
    margin-bottom: 12px;
  }

  .chat-user b,
  .chat-bot b {
    display: inline-block;
    margin-bottom: 4px;
  }

  .chat-bot a {
    color: #7fe0d8;
    text-decoration: none;
    font-weight: 600;
  }

  .chat-bot a:hover {
    text-decoration: underline;
  }

  .chat-list {
    margin: 8px 0 0;
    padding-left: 18px;
  }

  .chat-list li {
    margin: 6px 0;
  }

  #chat-input-wrap {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px;
    background: #1a2429;
  }

  #chat-input {
    width: 100%;
    padding: 10px 11px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95em;
    outline: none;
  }

  @media (max-width: 900px) {
    #chatbox {
      position: static;
      width: 100%;
      max-width: 520px;
      margin: 18px auto 0;
    }

    .card {
      min-width: 170px;
      max-width: 170px;
    }

    .card img {
      height: 96px;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Recovery's Got Talent</h1>

  <h2>Featured Playlist</h2>
  <iframe width="560" height="315"
    src="https://www.youtube.com/embed/videoseries?list=PLBKLQ3LsQZCO6KcklmmA_q2RFmg5zNEQU"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <h2>The Recovery Channel</h2>
  <a class="button-link" href="https://www.youtube.com/@therecoverychannel2026" target="_blank" rel="noopener noreferrer">
    Visit Channel
  </a>

  <div id="library"></div>
</div>

<div id="chatbox">
  <div id="chat-header">Need Support</div>
  <div id="chat-messages"></div>
  <div id="chat-input-wrap">
    <input id="chat-input" placeholder="Type here..." />
  </div>
</div>

<script>
  const videos = [/* SAME AS YOUR ORIGINAL — unchanged */];

  const categories = [
    "Recovery Motivation",
    "Powerful Talks",
    "Real Stories of Recovery",
    "Understanding Addiction"
  ];

  function youtubeThumb(videoId) {
    return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
  }

  function youtubeLink(videoId) {
    return `https://www.youtube.com/watch?v=${videoId}`;
  }

  function escapeHtml(str) {
    return str
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function renderLibrary() {
    const library = document.getElementById("library");
    library.innerHTML = categories.map(category => {
      const categoryVideos = videos.filter(v => v.category === category);
      const rowId = `row-${category.toLowerCase().replaceAll(" ", "-")}`;

      return `
        <h2 class="section-heading">${category}</h2>
        <div class="row" id="${rowId}">
          ${categoryVideos.map(video => `
            <div class="card" id="card-${video.id}" data-video-id="${video.id}">
              <img src="${youtubeThumb(video.id)}" alt="${escapeHtml(video.title)} thumbnail">
              <div class="card-content">
                <a href="${youtubeLink(video.id)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(video.title)}
                </a>
                <div class="card-meta">${escapeHtml(video.category)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }).join("");
  }

  renderLibrary();
</script>

</body>
</html>
