  body {

  }

  }

    font-weight: 600;
  }

    background: #3a9a8a;
  }

  .section-heading {
    text-align: left;
    margin-top: 28px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    margin-bottom: 20px;
    justify-content: flex-start;
    padding-bottom: 6px;
    scroll-behavior: smooth;
  }

  .row::-webkit-scrollbar {
    height: 10px;
  }

  .row::-webkit-scrollbar-thumb {
    background: rgba(77, 182, 172, 0.45);
    border-radius: 999px;
  }

  .card {
    min-width: 190px;
    max-width: 190px;
    background: #243238;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    text-align: left;
    border: 1px solid rgba(255,255,255,0.05);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
  }

  .card img {
    width: 100%;
    height: 107px;
    object-fit: cover;
    display: block;
  }

  .card-content {
    padding: 9px 10px 12px;
  }

  .card a {
    color: #4db6ac;
    text-decoration: none;
    font-size: 0.88em;
    font-weight: 600;
    line-height: 1.35;
    display: block;
    margin-bottom: 6px;
  }

  .card a:hover {
    text-decoration: underline;
  }

  .card-meta {
    font-size: 0.72em;
    color: #b9c9c9;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .highlight {
    box-shadow: 0 0 0 2px #4db6ac, 0 0 24px rgba(77, 182, 172, 0.45);
    border-color: #4db6ac;
  }

  /* Chatbot */
  #chatbox {
    width: 300px;
    background: #1f2a30;
    border-radius: 12px;
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
  }

  #chat-header {
    background: #4db6ac;
    padding: 10px;
    text-align: center;
    color: white;
    font-weight: 700;
  }

  #chat-messages {
    height: 280px;
    overflow-y: auto;
    padding: 12px;
    font-size: 0.92em;
    text-align: left;
    line-height: 1.45;
  }

  .chat-line {
    margin-bottom: 12px;
  }

  .chat-user b,
  .chat-bot b {
    display: inline-block;
    margin-bottom: 4px;
  }

  .chat-bot a {
    color: #7fe0d8;
    text-decoration: none;
    font-weight: 600;
  }

  .chat-bot a:hover {
    text-decoration: underline;
  }

  .chat-list {
    margin: 8px 0 0;
    padding-left: 18px;
  }

  .chat-list li {
    margin: 6px 0;
  }

  #chat-input-wrap {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px;
    background: #1a2429;
  }

  #chat-input {
    width: 100%;
    padding: 10px 11px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95em;
    outline: none;
  }

  @media (max-width: 900px) {
    #chatbox {
      position: static;
      width: 100%;
      max-width: 520px;
      margin: 18px auto 0;
    }

    .card {
      min-width: 170px;
      max-width: 170px;
    }

    .card img {
      height: 96px;
    }
  }
</style>

  const categories = [
    "Recovery Motivation",
    "Powerful Talks",
    "Real Stories of Recovery",
    "Understanding Addiction"
  ];

  const categoryEmoji = {
    "Recovery Motivation": "🔥",
    "Powerful Talks": "🎤",
    "Real Stories of Recovery": "⭐",
    "Understanding Addiction": "🧠"
  };

  function youtubeThumb(videoId) {
    return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
  }

  function youtubeLink(videoId) {
    return `https://www.youtube.com/watch?v=${videoId}`;
  }

  function escapeHtml(str) {
    return str
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function renderLibrary() {
    const library = document.getElementById("library");
    library.innerHTML = categories.map(category => {
      const categoryVideos = videos.filter(v => v.category === category);
      const rowId = `row-${category.toLowerCase().replaceAll(" ", "-")}`;

      return `
        <h2 class="section-heading">${categoryEmoji[category]} ${category}</h2>
        <div class="row" id="${rowId}">
          ${categoryVideos.map(video => `
            <div class="card" id="card-${video.id}" data-video-id="${video.id}">
              <img src="${youtubeThumb(video.id)}" alt="${escapeHtml(video.title)} thumbnail">
              <div class="card-content">
                <a href="${youtubeLink(video.id)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(video.title)}
                </a>
                <div class="card-meta">${escapeHtml(video.category)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }).join("");
  }

  renderLibrary();

  const messages = document.getElementById("chat-messages");
  const input = document.getElementById("chat-input");

  function msg(html, who = "bot") {
    const d = document.createElement("div");
    d.className = `chat-line chat-${who}`;
    d.innerHTML = html;
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
  }

  function clearHighlights() {
    document.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
  }

  function highlightCards(videoIds) {
    clearHighlights();

    videoIds.forEach((id, index) => {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      setTimeout(() => {
        card.classList.add("highlight");
      }, index * 120);
    });

    const first = document.getElementById(`card-${videoIds[0]}`);
    if (first) {
      first.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
      const row = first.closest(".row");
      if (row) {
        const rowRect = row.getBoundingClientRect();
        const cardRect = first.getBoundingClientRect();
        row.scrollLeft += (cardRect.left - rowRect.left) - 24;
      }
    }

    setTimeout(clearHighlights, 5000);
  }

  function normalize(text) {
    return text.toLowerCase().replace(/[^a-z0-9\s']/g, " ");
  }

  function scoreVideo(video, text) {
    let score = 0;

    const keywordGroups = [
      { words: ["use", "using", "relapse", "craving", "tempted", "urge"], tags: ["craving", "relapse", "motivation", "hope"] },
      { words: ["alcohol", "drinking", "drink", "beer", "vodka", "wine"], tags: ["alcohol", "sobriety"] },
      { words: ["drug", "drugs", "opioid", "heroin", "pill", "fentanyl"], tags: ["drugs", "heroin", "opiates", "substance use"] },
      { words: ["sad", "depressed", "hopeless", "empty", "worthless"], tags: ["hope", "story", "healing", "worth"] },
      { words: ["shame", "guilt", "stigma", "embarrassed"], tags: ["shame", "stigma", "compassion", "hope"] },
      { words: ["alone", "lonely", "nobody", "isolated"], tags: ["connection", "story", "hope"] },
      { words: ["anxious", "anxiety", "panic", "mind racing"], tags: ["science", "brain", "understanding", "education"] },
      { words: ["why", "brain", "dopamine", "science", "understand"], tags: ["science", "brain", "dopamine", "understanding", "education"] },
      { words: ["celebrity", "famous", "actor", "rapper", "singer"], tags: ["celebrity", "music"] },
      { words: ["motivation", "encouragement", "push", "strength"], tags: ["motivation", "hope", "fight"] }
    ];

    keywordGroups.forEach(group => {
      const hit = group.words.some(word => text.includes(word));
      if (hit) {
        video.tags.forEach(tag => {
          if (group.tags.includes(tag)) score += 3;
        });
      }
    });

    // Direct tag matching
    video.tags.forEach(tag => {
      if (text.includes(tag)) score += 4;
    });

    // Helpful defaults
    if (text.includes("talk") && video.category === "Powerful Talks") score += 5;
    if (text.includes("story") && video.category === "Real Stories of Recovery") score += 5;
    if (text.includes("science") && video.category === "Understanding Addiction") score += 5;
    if ((text.includes("motivation") || text.includes("help me")) && video.category === "Recovery Motivation") score += 5;

    return score;
  }

  function recommendVideos(userText) {
    const text = normalize(userText);

    const dangerNow =
      text.includes("overdose") ||
      text.includes("od") ||
      text.includes("i might die") ||
      text.includes("i want to die") ||
      text.includes("kill myself") ||
      text.includes("suicide") ||
      text.includes("end it") ||
      text.includes("about to use") ||
      text.includes("using tonight") ||
      text.includes("using now");

    const ranked = [...videos]
      .map(video => ({ video, score: scoreVideo(video, text) }))
      .sort((a, b) => b.score - a.score);

    let picks = ranked.filter(item => item.score > 0).slice(0, 3).map(item => item.video);

    if (picks.length === 0) {
      picks = [
        videos.find(v => v.id === "PjSX9Oum08E"),
        videos.find(v => v.id === "OG--M8B04DA"),
        videos.find(v => v.id === "bwZcPwlRRcc")
      ].filter(Boolean);
    }

    return { dangerNow, picks };
  }

  function buildResponse(userText) {
    const { dangerNow, picks } = recommendVideos(userText);

    if (dangerNow) {
      highlightCards(picks.map(v => v.id));

      return `
        <b>Bot:</b> I’m really glad you reached out right now.<br><br>
        If you’re in immediate danger, call or text <b>988</b> right now. If there is an overdose risk, call <b>911</b> now.<br><br>
        While you do that, here are 3 specific things on this page to click immediately:
        <ol class="chat-list">
          ${picks.map(v => `
            <li>
              <a href="${youtubeLink(v.id)}" target="_blank" rel="noopener noreferrer">${escapeHtml(v.title)}</a>
              <div style="font-size:0.85em;color:#b9c9c9;">${escapeHtml(v.category)}</div>
            </li>
          `).join("")}
        </ol>
      `;
    }

    highlightCards(picks.map(v => v.id));

    return `
      <b>Bot:</b> I picked a few specific things on this page for what you said:
      <ol class="chat-list">
        ${picks.map(v => `
          <li>
            <a href="${youtubeLink(v.id)}" target="_blank" rel="noopener noreferrer">${escapeHtml(v.title)}</a>
            <div style="font-size:0.85em;color:#b9c9c9;">${escapeHtml(v.category)}</div>
          </li>
        `).join("")}
      </ol>
      Start with the first one. I highlighted them on the page too.
    `;
  }

  input.addEventListener("keypress", e => {
    if (e.key === "Enter" && input.value.trim()) {
      const userText = input.value.trim();
      msg(`<b>You:</b> ${escapeHtml(userText)}`, "user");
      const response = buildResponse(userText);
      setTimeout(() => msg(response, "bot"), 250);
      input.value = "";
    }
  });

  msg(
    `<b>Bot:</b> Hi, I’m here with you. Tell me what’s going on — for example:
    <div class="chat-list">
      <div>• “I feel like using.”</div>
      <div>• “I’m anxious and my mind is racing.”</div>
      <div>• “I need a real recovery story.”</div>
      <div>• “I want something about the brain and addiction.”</div>
    </div>`,
    "bot"
  );
</script>
