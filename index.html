<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Recovery Channel</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TBT8ZJFEYV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-TBT8ZJFEYV');
</script>  

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  background:#2b3a42;
  font-family:'Open Sans', "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color:#e0e6e6;
  margin:0;
  padding:0;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
  text-align:center; /* center everything inside container */
}

/* Chatbot Top Right */
#chatbox {
  width:260px;
  background:#1f2a30;
  border-radius:10px;
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;
}

#chat-header {
  background:#4db6ac;
  padding:8px;
  text-align:center;
  color:white;
}

#chat-messages {
  height:180px;
  overflow-y:auto;
  padding:10px;
  font-size:0.9em;
}

#chat-input {
  width:100%;
  padding:8px;
  border:none;
}

/* Headings */
h1, h2 {
  margin:10px 0;
}

/* BUTTON */
.button-link {
  display:inline-block;
  background:#4db6ac;
  color:white;
  padding:10px 20px;
  border-radius:6px;
  text-decoration:none;
  margin-top:10px;
}
.button-link:hover { background:#3a9a8a; }

/* ROW */
.row {
  display:flex;
  overflow-x:auto;
  gap:12px;
  margin-bottom:20px;
  justify-content:flex-start;
}

/* CARDS */
.card {
  min-width:170px;
  background:#243238;
  border-radius:8px;
  overflow:hidden;
  flex-shrink:0;
}

.card img {
  width:100%;
  height:95px;
  object-fit:cover;
}

.card a {
  display:block;
  padding:8px;
  font-size:0.85em;
  color:#4db6ac;
  text-decoration:none;
}

/* highlight */
.highlight {
  box-shadow:0 0 12px #4db6ac;
}
</style>
</head>

<body>

<div class="container">
<h1>Recovery's Got Talent</h1>

<!-- Featured Playlist Centered -->
<h2>Featured Playlist</h2>
<iframe width="560" height="315"
  src="https://www.youtube.com/embed/videoseries?list=PLBKLQ3LsQZCO6KcklmmA_q2RFmg5zNEQU"
  frameborder="0" allowfullscreen>
</iframe>

<!-- The Recovery Channel Centered -->
<h2>The Recovery Channel</h2>
<a class="button-link" href="https://www.youtube.com/@therecoverychannel2026" target="_blank">
Visit Channel
</a>

<script>
function card(id, vid, title){
  return `<div class="card" id="${id}">
    <img src="https://img.youtube.com/vi/${vid}/0.jpg">
    <a href="https://www.youtube.com/watch?v=${vid}" target="_blank">${title}</a>
  </div>`;
}
</script>

<!-- 🔥 MOTIVATION -->
<h2>🔥 Recovery Motivation</h2>
<div class="row">
<script>
document.write(
card("m1","ZXsQAXx_ao0","If You're Struggling Right Now – Watch This")+
card("m2","mgmVOuLgFB0","One Day at a Time – Recovery Message")+
card("m3","wnHW6o8WMas","You Can Beat Addiction")+
card("m4","4cYuWLZI5kw","Keep Going – Motivation")+
card("m5","hLQl3WQQoQ0","Stay Strong Through Hard Moments")+
card("m6","RgKAFK5djSk","Don't Give Up – Recovery Motivation")
);
</script>
</div>

<!-- 🎤 TALKS -->
<h2>🎤 Powerful Talks</h2>
<div class="row">
<script>
document.write(
card("t1","PY9DcIMGxMs","Russell Brand on Addiction & Recovery")+
card("t2","ys6TCO_olOc","Johann Hari TED Talk on Addiction")+
card("t3","66cYcSak6nE","Gabor Maté – The Power of Addiction")+
card("t4","tdJAQZxJ6vY","Addiction & Stigma Talk")+
card("t5","e0WZx7lUOrY","How Addiction Changes the Brain")+
card("t6","QmOF0crdyRU","Dopamine and Addiction Explained")
);
</script>
</div>

<!-- ⭐ STORIES -->
<h2>⭐ Real Stories of Recovery</h2>
<div class="row">
<script>
document.write(
card("s1","OG--M8B04DA","Brandon Novak – Full Recovery Story")+
card("s2","Kj0E3wF2l4Q","Jelly Roll on Addiction and Redemption")+
card("s3","5S7c3lq3s7M","Macklemore on Drug Addiction")+
card("s4","3Z4QWf0G0k0","Eminem Talks About Sobriety")+
card("s5","l482T0yNkeo","Personal Story – Hitting Rock Bottom")+
card("s6","60ItHLz5WEA","From Addiction to Recovery Journey")
);
</script>
</div>

<!-- 🧠 SCIENCE -->
<h2>🧠 Understanding Addiction</h2>
<div class="row">
<script>
document.write(
card("u1","p3JLaF_4Tz8","How Addiction Works in the Brain")+
card("u2","ao8L-0nSYzg","Why Addiction Happens")+
card("u3","BVg2bfqblGI","Neuroscience of Addiction")+
card("u4","h6fcK_fRYaI","Habit Loop Explained")+
card("u5","VYOjWnS4cMY","Why We Get Addicted")+
card("u6","uelHwf8o7_U","Addiction Explained Clearly")
);
</script>
</div>

</div>

<!-- CHATBOT BACK -->
<div id="chatbox">
  <div id="chat-header">Need Support 💬</div>
  <div id="chat-messages"></div>
  <input id="chat-input" placeholder="Type here...">
</div>

<script>
const messages=document.getElementById("chat-messages");
const input=document.getElementById("chat-input");

function msg(t){
 let d=document.createElement("div");
 d.innerHTML=t;
 messages.appendChild(d);
 messages.scrollTop=messages.scrollHeight;
}

function highlight(id){
 let el=document.getElementById(id);
 el.scrollIntoView({behavior:"smooth", block:"center"});
 el.classList.add("highlight");
 setTimeout(()=>el.classList.remove("highlight"),2000);
}

function bot(t){
 t=t.toLowerCase();
 if(t.includes("use")||t.includes("craving")){
  highlight("m1");
  return `You're not alone right now.<br>
  <a href="https://www.youtube.com/watch?v=ZXsQAXx_ao0" target="_blank">▶ Watch this now</a><br>
  Just press play and stay with it.<br>
  If you're in danger, call or text 988.`;
 }
 if(t.includes("sad")||t.includes("depressed")){
  highlight("s1");
  return `You might connect with this story:<br>
  <a href="https://www.youtube.com/watch?v=OG--M8B04DA" target="_blank">▶ Watch here</a>`;
 }
 if(t.includes("anxious")){
  highlight("u1");
  return `This might help you understand what's happening:<br>
  <a href="https://www.youtube.com/watch?v=p3JLaF_4Tz8" target="_blank">▶ Watch this</a>`;
 }
 return `I'm here with you.<br>
 Try starting with something above—just press play.`;
}

input.addEventListener("keypress",e=>{
 if(e.key==="Enter" && input.value.trim()){
  msg("<b>You:</b> "+input.value);
  setTimeout(()=>msg("<b>Bot:</b> "+bot(input.value)),500);
  input.value="";
 }
});

msg("<b>Bot:</b> Hi, I'm here with you. What's going on?");
</script>

</body>
</html>
