<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Recovery Channel</title>

<style>
body {
  background:#2b3a42;
  font-family:Segoe UI;
  color:#e0e6e6;
  margin:0;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:30px;
  text-align:center;
}

h2.center { text-align:center; }
h2.left { text-align:left; }

/* ROW */
.row {
  display:flex;
  overflow-x:auto;
  gap:10px;
}

/* SMALLER CARDS */
.card {
  min-width:160px;
  background:#243238;
  border-radius:8px;
  overflow:hidden;
  flex-shrink:0;
}

.card img {
  width:100%;
  height:90px;
  object-fit:cover;
}

.card a {
  display:block;
  padding:8px;
  font-size:0.85em;
  color:#4db6ac;
  text-decoration:none;
}

/* highlight */
.highlight {
  box-shadow:0 0 12px #4db6ac;
}

/* chatbot */
#chatbox {
  position:fixed;
  bottom:20px;
  right:20px;
  width:260px;
  background:#1f2a30;
  border-radius:10px;
}

#chat-header {
  background:#4db6ac;
  padding:8px;
  text-align:center;
  color:white;
}

#chat-messages {
  height:180px;
  overflow-y:auto;
  padding:10px;
  font-size:0.9em;
}

#chat-input {
  width:100%;
  padding:8px;
  border:none;
}
</style>
</head>

<!-- CHAT -->
<div id="chatbox">
<div id="chat-header">Need Support 💬</div>
<div id="chat-messages"></div>
<input id="chat-input">
</div>

<script>
const messages=document.getElementById("chat-messages");
const input=document.getElementById("chat-input");

function msg(t){let d=document.createElement("div");d.innerHTML=t;messages.appendChild(d);}

function highlight(id){
 let el=document.getElementById(id);
 el.scrollIntoView({behavior:"smooth"});
 el.classList.add("highlight");
 setTimeout(()=>el.classList.remove("highlight"),2000);
}

function bot(t){
 t=t.toLowerCase();
 if(t.includes("use")){
  highlight("m1");
  return `You're not alone.<br><a href="https://www.youtube.com/watch?v=ZXsQAXx_ao0">▶ Watch this now</a><br>Call 988 if needed.`;
 }
 if(t.includes("sad")){
  highlight("s1");
  return `Try this story:<br><a href="https://www.youtube.com/watch?v=OG--M8B04DA">▶ Watch</a>`;
 }
 return "I'm here. Try a video above.";
}

input.addEventListener("keypress",e=>{
 if(e.key==="Enter"){
  msg("<b>You:</b> "+input.value);
  setTimeout(()=>msg("<b>Bot:</b> "+bot(input.value)),500);
  input.value="";
 }
});

msg("<b>Bot:</b> I'm here with you.");
</script>
