<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Recovery Channel</title>

<style>
body {
  background-color: #2b3a42;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: #e0e6e6;
  margin: 0;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
  text-align: center;
}

h2.centered { text-align: center; }
h2.left { text-align: left; }

.row {
  display: flex;
  overflow-x: auto;
  gap: 15px;
}

.card {
  min-width: 240px;
  background: #243238;
  border-radius: 10px;
  overflow: hidden;
  transition: transform .2s;
}

.card:hover { transform: scale(1.05); }

.card img {
  width: 100%;
  display: block;
}

.card a {
  display: block;
  padding: 10px;
  color: #4db6ac;
  text-decoration: none;
}

/* highlight effect */
.highlight {
  box-shadow: 0 0 15px 5px #4db6ac;
}

/* chatbot */
#chatbox {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 280px;
  background: #1f2a30;
  border-radius: 10px;
}

#chat-header {
  background: #4db6ac;
  padding: 10px;
  text-align: center;
  color: white;
}

#chat-messages {
  height: 200px;
  overflow-y: auto;
  padding: 10px;
}

#chat-input {
  width: 100%;
  padding: 10px;
  border: none;
}
</style>
</head>

<body>

<div class="container">
<h1>Recovery's Got Talent</h1>

<h2 class="centered">Featured Playlist</h2>
<iframe width="560" height="315"
src="https://www.youtube.com/embed/videoseries?list=PLBKLQ3LsQZCO6KcklmmA_q2RFmg5zNEQU">
</iframe>

<h2 class="centered">The Recovery Channel</h2>
<a href="https://www.youtube.com/@therecoverychannel2026" target="_blank">Visit Channel</a>

<!-- ROW -->
<h2 class="left">🔥 Recovery Motivation</h2>
<div class="row">
<div class="card" id="vid1">
<img src="https://img.youtube.com/vi/ZXsQAXx_ao0/0.jpg">
<a href="https://www.youtube.com/watch?v=ZXsQAXx_ao0" target="_blank">If You're Struggling Right Now</a>
</div>

<div class="card" id="vid2">
<img src="https://img.youtube.com/vi/mgmVOuLgFB0/0.jpg">
<a href="https://www.youtube.com/watch?v=mgmVOuLgFB0">One Day at a Time</a>
</div>
</div>

<h2 class="left">⭐ Real Stories</h2>
<div class="row">
<div class="card" id="vid3">
<img src="https://img.youtube.com/vi/OG--M8B04DA/0.jpg">
<a href="https://www.youtube.com/watch?v=OG--M8B04DA">Brandon Novak Story</a>
</div>

<div class="card" id="vid4">
<img src="https://img.youtube.com/vi/Kj0E3wF2l4Q/0.jpg">
<a href="https://www.youtube.com/watch?v=Kj0E3wF2l4Q">Jelly Roll Interview</a>
</div>
</div>

</div>

<!-- CHAT -->
<div id="chatbox">
<div id="chat-header">Need Support? 💬</div>
<div id="chat-messages"></div>
<input id="chat-input" placeholder="Type here...">
</div>

<script>
const messages = document.getElementById("chat-messages");
const input = document.getElementById("chat-input");

function addMessage(text) {
  let div = document.createElement("div");
  div.innerHTML = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function highlight(id){
  let el = document.getElementById(id);
  el.scrollIntoView({behavior:"smooth"});
  el.classList.add("highlight");
  setTimeout(()=>el.classList.remove("highlight"),2000);
}

function botResponse(text){
  text = text.toLowerCase();

  if(text.includes("use") || text.includes("craving")){
    highlight("vid1");
    return `You're not alone. <br><a href="https://www.youtube.com/watch?v=ZXsQAXx_ao0" target="_blank">▶ Watch this right now</a><br>If you're in danger call 988.`;
  }

  if(text.includes("sad")){
    highlight("vid3");
    return `Try this story—you might relate:<br><a href="https://www.youtube.com/watch?v=OG--M8B04DA">▶ Watch</a>`;
  }

  return "I'm here with you. Try watching something above.";
}

input.addEventListener("keypress", e=>{
  if(e.key==="Enter"){
    addMessage("<b>You:</b> "+input.value);
    let r = botResponse(input.value);
    setTimeout(()=>addMessage("<b>Bot:</b> "+r),500);
    input.value="";
  }
});

addMessage("<b>Bot:</b> Hi, I'm here with you. What's going on?");
</script>

</body>
</html>
